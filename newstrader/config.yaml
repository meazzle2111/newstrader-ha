name: NewsTrader
version: "0.19.0"
slug: newstrader
description: Paper-Trading-Bot mit Nachrichtenanalyse (Spielgeld) und Signalen für dein Depot
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
watchdog: "http://[HOST]:[PORT:8099]/api/health"
panel_icon: mdi:chart-line
panel_title: NewsTrader
homeassistant_api: true
map:
  - share:rw
options:
  gemini_api_key: ""
  claude_token: ""
  notify_service: ""
  trading_mode: leverage
schema:
  gemini_api_key: password?
  claude_token: password?
  notify_service: str?
  trading_mode: list(cash|leverage)
